                        <input type="date" name="dete">

                    <dd><input type="text" name="children-name" required placeholder="田中 太郎"></dd>


                    <dt>ふりがな<span class="must">※</span></dt>
                    <dd><input type="text" name="children-name" required placeholder="たなか たろう"></dd>

                    <dt>学年</dt>
                    <dd>
                        <select name="学年">
                            <option value="選択してください" selected>選択してください</option>
                            <option value="未就学児">未就学児</option>
                            <option value="小学1年">小学1年</option>
                            <option value="小学2年">小学2年</option>
                            <option value="小学3年">小学3年</option>
                            <option value="小学4年">小学4年</option>
                            <option value="小学5年">小学5年</option>
                            <option value="小学6年">小学6年</option>
                            <option value="中学1年">中学1年</option>
                            <option value="中学2年">中学2年</option>
                            <option value="中学3年">中学3年</option>
                        </select>
                    </dd>

                    <dt>保護者のお名前<span class="must">※</span></dt>
                    <dd><input type="text" name="your-name" required placeholder="田中 花子"></dd>

                    <dt>ふりがな<span class="must">※</span></dt>
                    <dd><input type="text" name="your-name" required placeholder="たなか はなこ"></dd>

                    <dt>メールアドレス<span class="must">※</span></dt>
                    <dd><input type="email" name="email" required placeholder="sample@test.com"></dd>
